<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Technical Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css">
  <style>
    /* ---------- palette ---------- */
    :root {
      /* brand */
      --brand-navy:   #090056;
      --brand-violet: #8a49f7;
      --brand-mint:   #40deb9;

      --theme-color:  #6d28d9;
      --accent:       #6d28d9;

      --page-bg:      #ffffff;
      --page-fg:      #3a3a55;
      --heading-fg:   #090056;

      --sidebar-bg:      #090056;
      --sidebar-fg:      #c9c5e8;
      --sidebar-group:   #8b84c9;
      --sidebar-sub:     #a09ad6;
      --sidebar-hover:   #ffffff;
      --sidebar-active:  #40deb9;
      --sidebar-border:  #1c1470;

      --border:       #e4e2f2;
      --table-head:   #f4f2fd;
      --table-alt:    #faf9ff;
      --inline-bg:    #f1eefe;
      --inline-fg:    #6d28d9;

      --quote-bg:     #f3fcf9;
      --quote-border: #40deb9;

      --code-bg:      #fbfaff;
      --code-fg:      #2e2e45;
      --code-border:  #e4e2f2;
      --tok-keyword:  #7c3aed;
      --tok-func:     #0b5fce;
      --tok-string:   #0f8f76;
      --tok-number:   #b45309;
      --tok-punct:    #6b6b85;
      --tok-comment:  #8e8ca8;
    }

    /* ---------- page ---------- */
    body, .content { background: var(--page-bg); }
    .markdown-section { color: var(--page-fg); }
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4,
    .markdown-section strong { color: var(--heading-fg); }
    .markdown-section h1 {
      padding-bottom: .4em;
      border-bottom: 3px solid var(--brand-mint);
    }
    .markdown-section h2 { color: var(--brand-navy); }
    .markdown-section a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(109, 40, 217, .28);
    }
    .markdown-section a:hover {
      color: var(--brand-violet);
      border-bottom-color: var(--brand-violet);
    }
    /* heading permalinks are anchors — keep them out of the link styling */
    .markdown-section a.anchor { border-bottom: none; font-weight: inherit; color: inherit; }
    .markdown-section a.anchor span { color: inherit; }
    .markdown-section blockquote {
      color: var(--page-fg);
      background: var(--quote-bg);
      border-left: 4px solid var(--quote-border);
      border-radius: 0 6px 6px 0;
      padding: .9em 1.2em;
      margin: 1.4em 0;
    }
    .markdown-section blockquote p { font-weight: 400; }
    .markdown-section table { border-collapse: collapse; }
    .markdown-section th {
      background: var(--table-head);
      color: var(--heading-fg);
      font-weight: 600;
    }
    .markdown-section tr { border-top-color: var(--border); background: var(--page-bg); }
    .markdown-section tr:nth-child(2n) { background: var(--table-alt); }
    .markdown-section th, .markdown-section td { border-color: var(--border); }
    .markdown-section hr { border-color: var(--border); }

    /* ---------- sidebar ---------- */
    .sidebar {
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
    }
    .sidebar > h1 { margin: 1.4rem 0 1rem; }
    .sidebar > h1 .app-name-link { color: #ffffff !important; font-weight: 700; }
    .sidebar ul li a {
      color: var(--sidebar-fg);
      border-bottom: none;
      transition: color .15s ease;
    }
    .sidebar ul li a:hover { color: var(--sidebar-hover); text-decoration: none; }
    .sidebar ul li.active > a {
      color: var(--sidebar-active);
      border-right: 2px solid var(--sidebar-active);
      font-weight: 600;
    }
    /* group headings carry a nested list; leaf items are links */
    .sidebar .sidebar-nav li { color: var(--sidebar-sub); font-weight: 600; }
    .sidebar .sidebar-nav > ul > li:has(> ul) {
      color: var(--sidebar-group);
      font-size: 12px;
      letter-spacing: .07em;
      text-transform: uppercase;
      margin-top: 1.4em;
    }
    .sidebar .sidebar-nav > ul > li:has(> ul) > ul {
      font-size: 15px;
      letter-spacing: 0;
      text-transform: none;
    }
    .sidebar ul li a { text-transform: none; letter-spacing: 0; font-weight: 400; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--sidebar-border); }
    .sidebar-toggle { background-color: transparent; }
    .sidebar-toggle .sidebar-toggle-button span { background-color: var(--brand-navy); }

    /* ---------- code ---------- */
    .markdown-section code:not([class*="lang-"]) {
      background: var(--inline-bg);
      color: var(--inline-fg);
      border-radius: 4px;
    }
    .markdown-section pre {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 6px;
      padding: .2em 1.3em;
      overflow-x: auto;
    }
    .markdown-section pre > code {
      background: transparent;
      color: var(--code-fg);
      padding: 1.1em 0;
    }
    .markdown-section pre[data-lang] {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 6px;
      padding: .2em 1.3em;
      overflow-x: auto;
    }
    .markdown-section pre[data-lang]::after {
      content: attr(data-lang);
      color: var(--tok-comment);
      background: transparent;
      padding: 4px 10px;
      font-size: 11px;
      letter-spacing: .09em;
      text-transform: uppercase;
      top: 0;
      right: 0;
    }
    .markdown-section pre[data-lang] > code {
      background: transparent;
      color: var(--code-fg);
      font-size: 13.5px;
      line-height: 1.6;
      white-space: pre;
    }
    .markdown-section pre[data-lang] .token.keyword,
    .markdown-section pre[data-lang] .token.boolean,
    .markdown-section pre[data-lang] .token.null {
      color: var(--tok-keyword);
      font-weight: 600;
    }
    .markdown-section pre[data-lang] .token.function { color: var(--tok-func); }
    .markdown-section pre[data-lang] .token.string   { color: var(--tok-string); }
    .markdown-section pre[data-lang] .token.number   { color: var(--tok-number); }
    .markdown-section pre[data-lang] .token.operator,
    .markdown-section pre[data-lang] .token.punctuation { color: var(--tok-punct); background: transparent; }
    .markdown-section pre[data-lang] .token.comment  { color: var(--tok-comment); font-style: italic; }

    /* ---------- GCP component icons, part 1.2 ---------- */
    .markdown-section h2[id="cloud-storage-standard-class-not-archive"]::before,
    .markdown-section h2[id="dataflow-beam-rejected"]::before,
    .markdown-section h2[id="airflow-composer-rejected-dataform-instead"]::before {
      content: "";
      display: inline-block;
      width: 22px;
      height: 22px;
      margin-right: 8px;
      vertical-align: middle;
      background-size: contain;
      background-repeat: no-repeat;
    }
    .markdown-section h2[id="cloud-storage-standard-class-not-archive"]::before       { background-image: url("assets/icons/storage.png"); }
    .markdown-section h2[id="dataflow-beam-rejected"]::before                         { background-image: url("assets/icons/dataflow.png"); }
    .markdown-section h2[id="airflow-composer-rejected-dataform-instead"]::before     { background-image: url("assets/icons/composer.png"); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Technical Test',
      loadSidebar: true,
      subMaxLevel: 0,
      auto2top: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
</body>
</html>
